<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Output Swap">
  <title>Output Swap</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1f2a"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
  </defs>
  <rect x="28" y="28" width="344" height="344" rx="76" fill="url(#tile)" stroke="#2a2a36" stroke-width="2"/>

  <!-- Upper source node: dimmed — its downstream link has just been taken away. -->
  <rect x="66" y="108" width="88" height="62" rx="16" fill="none" stroke="#ffb02e" stroke-opacity="0.3" stroke-width="12"/>
  <!-- Lower source node: the dragged output that now feeds the downstream input. -->
  <rect x="66" y="230" width="88" height="62" rx="16" fill="none" stroke="#ffb02e" stroke-width="13"/>
  <!-- Downstream node whose input got re-homed. -->
  <rect x="272" y="169" width="62" height="62" rx="16" fill="none" stroke="#ffb02e" stroke-width="13"/>

  <!-- Released link: dashed, dimmed, and visibly detached from the input it used to feed. -->
  <path d="M154,139 C204,139 214,166 238,180" fill="none" stroke="#ffb02e" stroke-opacity="0.3"
        stroke-width="12" stroke-linecap="round" stroke-dasharray="20 20"/>
  <!-- Taken-over link: solid, bold, fully connected. -->
  <path d="M154,261 C210,261 224,200 272,200" fill="none" stroke="#ffb02e"
        stroke-width="19" stroke-linecap="round"/>

  <!-- Slots: hollow/dim = released, filled = live. -->
  <circle cx="154" cy="139" r="14" fill="#12121a" stroke="#ffb02e" stroke-opacity="0.3" stroke-width="12"/>
  <circle cx="154" cy="261" r="17" fill="#ffb02e"/>
  <circle cx="272" cy="200" r="17" fill="#ffb02e"/>
</svg>
